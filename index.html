<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Srinandana Yogananda Sastry | Portfolio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        .animate-wobble { animation: wobble 2s ease-in-out infinite; }

        .visual-container {
            transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
            opacity: 0;
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transform: scale(0.95);
        }
        
        .visual-container.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }
        
        .hero-image-container {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 70%;
            overflow: hidden;
            border: 1px solid #27272a;
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .project-card {
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            border-color: #3b82f6;
            background-color: rgba(39, 39, 42, 0.4);
        }

        .mini-render-window {
            height: 120px;
            width: 100%;
            background: #0f0f10;
            border-bottom: 1px solid #27272a;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        
        .filter-btn {
            @apply px-3 py-1 text-[10px] font-mono border border-zinc-800 rounded-full transition-all cursor-pointer hover:border-blue-500 hover:text-blue-400;
        }
        .filter-btn.active {
            @apply bg-zinc-800 text-blue-400 border-blue-500;
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-zinc-400 overflow-x-hidden selection:bg-blue-500/30">

    <div class="flex flex-col min-h-screen">
        <div class="flex flex-col md:flex-row w-full">
            
            <div class="w-full md:w-1/2 p-6 md:p-16 lg:p-24 relative">
                <nav class="mb-24 flex justify-between items-center">
                    <div class="flex items-center gap-2 group cursor-default">
                        <div class="w-8 h-8 bg-blue-600 rounded-sm flex items-center justify-center text-white font-bold text-xs tracking-tighter">SRI</div>
                        <p class="text-white text-sm font-semibold uppercase tracking-widest">Srinandana Y Sastry</p>
                    </div>
                </nav>

                <section id="hero-section" class="mb-32 flex flex-col justify-center min-h-[40vh]">
                    <h1 class="text-4xl md:text-6xl font-light text-zinc-100 leading-tight mb-8">Hi There ! <span class="text-blue-500 italic">Welcome!!</span></h1>
                    <p class="max-w-md text-lg text-zinc-500 mb-10 leading-relaxed">Mechanical Engineering Graduate Student at Iowa State University.</p>
                </section>

                <div id="experience" class="space-y-16 mb-24">
                    <h2 class="text-xs font-mono uppercase tracking-widest text-blue-500">01 // Experience</h2>
                    <div class="space-y-2">
                        <h3 class="text-xl text-zinc-100">Research Assistant</h3>
                        <p class="text-sm text-blue-500 font-mono">Iowa State University // NSF Project</p>
                    </div>
                </div>
            </div>

            <div class="hidden md:block w-1/2 h-screen sticky top-0 overflow-hidden bg-[#0c0c0c] border-l border-zinc-900">
                <div class="relative h-full w-full flex flex-col items-center justify-center p-20">
                    
                    <div class="absolute top-8 left-8 right-8 flex justify-between font-mono text-[9px] text-zinc-600 border-b border-zinc-900 pb-2 uppercase tracking-widest">
                        <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>Live_Render_Engine</div>
                        <div id="project-ref">REF: PORTFOLIO_HOME</div>
                    </div>

                    <div class="w-full h-full relative flex items-center justify-center">
                        <div id="visual-hero" class="visual-container active">
                            <div class="hero-image-container">
                                <img src="WhatsApp Image 2026-01-14 at 1.58.29 PM.jpeg" class="grayscale">
                            </div>
                        </div>
                        
                        <div id="visual-experience" class="visual-container">
                            <div class="relative w-64 h-64 flex flex-col gap-4">
                                <div class="mt-8 border border-blue-900/30 p-4 rounded bg-blue-900/10">
                                    <p class="font-mono text-[10px] text-blue-400">>> FETCHING_CAREER_DATA</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        document.addEventListener('DOMContentLoaded', () => {
            const projectRefElement = document.getElementById('project-ref');
            const heroSection = document.getElementById('hero-section');
            const experienceSection = document.getElementById('experience');

            function updateActiveVisual(index) {
                // Update text reference
                projectRefElement.innerText = index === 'hero' ? `REF: PORTFOLIO_HOME` : `REF: EXPERIENCE_LOG`;

                // Remove active from all containers
                document.querySelectorAll('.visual-container').forEach(el => el.classList.remove('active'));
                
                // Add active to the correct one
                const activeVisual = document.getElementById(`visual-${index}`);
                if (activeVisual) activeVisual.classList.add('active');
            }

            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        if (entry.target.id === 'hero-section') updateActiveVisual('hero');
                        else if (entry.target.id === 'experience') updateActiveVisual('experience');
                    }
                });
            }, { threshold: 0.5 });

            if(heroSection) observer.observe(heroSection);
            if(experienceSection) observer.observe(experienceSection);
        });
    </script>
</body>
</html>
